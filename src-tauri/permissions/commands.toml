[[permission]]
identifier = "allow-get-app-status"
description = "Autorise la lecture de l'état de l'application"
commands.allow = ["get_app_status"]

[[permission]]
identifier = "allow-set-demo-mode"
description = "Autorise l'activation ou la désactivation du mode démo"
commands.allow = ["set_demo_mode"]

[[permission]]
identifier = "allow-set-log-level"
description = "Autorise le changement du niveau de journalisation"
commands.allow = ["set_log_level"]

[[permission]]
identifier = "allow-get-log-dir"
description = "Autorise la lecture du dossier des journaux"
commands.allow = ["get_log_dir"]

[[permission]]
identifier = "allow-set-fusion-options"
description = "Autorise la mise à jour des options de fusion HDR"
commands.allow = ["set_fusion_options"]

[[permission]]
identifier = "allow-set-locale"
description = "Autorise le changement de langue de l'interface"
commands.allow = ["set_locale"]

[[permission]]
identifier = "allow-set-theme"
description = "Autorise le changement de thème de l'interface"
commands.allow = ["set_theme"]

[[permission]]
identifier = "allow-set-sessions-dir"
description = "Autorise le changement du dossier des séances HDR"
commands.allow = ["set_sessions_dir"]

[[permission]]
identifier = "allow-list-jpeg-folder"
description = "Autorise la liste des JPEG d'un dossier"
commands.allow = ["list_jpeg_folder"]

[[permission]]
identifier = "allow-merge-image-folder"
description = "Autorise la fusion HDR d'un dossier d'images"
commands.allow = ["merge_image_folder"]

[[permission]]
identifier = "allow-cancel-fusion"
description = "Autorise l'annulation d'une fusion en cours"
commands.allow = ["cancel_fusion"]

[[permission]]
identifier = "allow-open-path"
description = "Autorise l'ouverture d'un dossier ou fichier dans l'explorateur"
commands.allow = ["open_path"]

[[permission]]
identifier = "allow-preview-bracket-plan"
description = "Autorise le calcul d'un plan de bracketing"
commands.allow = ["preview_bracket_plan"]

[[permission]]
identifier = "allow-start-capture"
description = "Autorise le démarrage d'une séance de bracketing"
commands.allow = ["start_capture"]

[[permission]]
identifier = "allow-cancel-capture"
description = "Autorise l'annulation d'une prise de vue en cours"
commands.allow = ["cancel_capture"]

[[permission]]
identifier = "allow-list-cameras"
description = "Autorise la liste des appareils LUMIX PnP"
commands.allow = ["list_cameras"]

[[permission]]
identifier = "allow-connect-camera"
description = "Autorise la connexion à un appareil LUMIX"
commands.allow = ["connect_camera"]

[[permission]]
identifier = "allow-disconnect-camera"
description = "Autorise la déconnexion de l'appareil LUMIX"
commands.allow = ["disconnect_camera"]

[[permission]]
identifier = "allow-get-camera-settings"
description = "Autorise la lecture des réglages et capacités d'exposition"
commands.allow = ["get_camera_settings"]

[[permission]]
identifier = "allow-set-camera-settings"
description = "Autorise l'application des réglages ISO/ouverture/vitesse"
commands.allow = ["set_camera_settings"]

[[permission]]
identifier = "allow-set-capture-defaults"
description = "Autorise la sauvegarde des paramètres de bracketing"
commands.allow = ["set_capture_defaults"]

[[permission]]
identifier = "allow-start-live-view"
description = "Autorise le démarrage du Live View"
commands.allow = ["start_live_view"]

[[permission]]
identifier = "allow-stop-live-view"
description = "Autorise l'arrêt du Live View"
commands.allow = ["stop_live_view"]
