name: Release

# Push d’un tag vX.Y.Z → build NSIS Windows + GitHub Release + latest.json (updater).
# Secrets requis (Settings → Secrets and variables → Actions) :
#   TAURI_SIGNING_PRIVATE_KEY          clé privée minisign (contenu de .secrets/tauri-updater.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  optionnel (vide si générée avec --ci)
#   LUMIX_SDK_PASSPHRASE               passphrase de ci/lumix-sdk-library.zip.enc
#     (le zip base64 dépasse la limite 64 Ko des secrets GitHub — d’où le .enc versionné)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # x-gha retiré de vcpkg — cache fichiers + actions/cache (évite ~1 h de rebuild OpenCV).
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"

jobs:
  windows:
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version depuis le tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      # VS 2026 (windows-2025) : Clang ≥ 20 requis pour opencv-binding-generator (STL1000).
      - name: Installer LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1.8"

      - name: Préparer le cache binaire vcpkg
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/.vcpkg-cache" | Out-Null

      - name: Restaurer le cache vcpkg (OpenCV)
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-cache
            vcpkg/installed
          key: vcpkg-opencv4-jpeg-png-tiff-x64-static-md-v1

      - name: Installer OpenCV via vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          if (-not (Test-Path "$root/vcpkg.exe")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git $root
            & "$root/bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$root/vcpkg.exe" install "opencv4[jpeg,png,tiff]:x64-windows-static-md"
          echo "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          echo "OpenCV_DIR=$root/installed/x64-windows-static-md/share/opencv4" >> $env:GITHUB_ENV
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV

      - name: Restaurer le SDK LUMIX
        shell: pwsh
        env:
          LUMIX_SDK_PASSPHRASE: ${{ secrets.LUMIX_SDK_PASSPHRASE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LUMIX_SDK_PASSPHRASE)) {
            throw "Secret LUMIX_SDK_PASSPHRASE manquant — passphrase de ci/lumix-sdk-library.zip.enc"
          }
          $enc = "ci/lumix-sdk-library.zip.enc"
          if (-not (Test-Path $enc)) {
            throw "$enc introuvable — lancer .\scripts\pack-lumix-sdk.ps1 puis committer le .enc"
          }
          . .\scripts\lumix-sdk-crypto.ps1
          $zip = Join-Path $env:RUNNER_TEMP "lumix-sdk-library.zip"
          Unprotect-LumixSdkZip -EncPath $enc -ZipPath $zip -Passphrase $env:LUMIX_SDK_PASSPHRASE
          $dest = "vendor/lumix-sdk/Library"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Remove-Item $zip -Force
          if (-not (Test-Path "$dest/Lmxptpif.dll")) {
            throw "Lmxptpif.dll introuvable après extraction"
          }
          if (-not (Test-Path "$dest/Lmxptpif.lib")) {
            throw "Lmxptpif.lib introuvable après extraction"
          }

      - uses: Swatinem/rust-cache@v2

      - run: yarn install --frozen-lockfile

      - name: Synchroniser la version
        run: node scripts/sync-version.mjs ${{ steps.ver.outputs.version }}

      - name: Build + Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: "LumixHDR ${{ steps.ver.outputs.tag }}"
          releaseBody: |
            Installateur Windows (NSIS) pour LumixHDR `${{ steps.ver.outputs.tag }}`.

            - Téléchargez `LumixHDR_*_x64-setup.exe` pour une installation neuve
            - Les mises à jour in-app utilisent `latest.json` + la signature `.sig`
          releaseDraft: false
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          generateReleaseNotes: true
