name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # x-gha a été retiré de vcpkg — cache fichiers + actions/cache.
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Installer les dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev \
            clang libclang-dev libopencv-dev pkg-config

      # VS 2026 (images windows-2025) exige Clang ≥ 20 pour parser la STL (STL1000).
      - name: Installer LLVM (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1.8"

      - name: Préparer le cache binaire vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/.vcpkg-cache" | Out-Null

      - name: Restaurer le cache vcpkg (OpenCV)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-cache
            vcpkg/installed
          key: vcpkg-opencv4-jpeg-png-tiff-x64-static-md-v1

      - name: Installer OpenCV via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          if (-not (Test-Path "$root/vcpkg.exe")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git $root
            & "$root/bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$root/vcpkg.exe" install "opencv4[jpeg,png,tiff]:x64-windows-static-md"
          echo "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          echo "OpenCV_DIR=$root/installed/x64-windows-static-md/share/opencv4" >> $env:GITHUB_ENV
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
